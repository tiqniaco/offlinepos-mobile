# Screen tour on a real Android emulator: sign up, then visit EVERY screen (top + scrolled) with screenshots,
# including keyboard-open states on forms. Run by .github/workflows/screens.yml; screenshots are uploaded.
appId: app.daftarak
---
- launchApp: { clearState: true }
- waitForAnimationToEnd: { timeout: 8000 }
# A slow emulator sometimes shows "… isn't responding" over the app: wait it out.
- tapOn: { text: "Wait", optional: true }
- waitForAnimationToEnd: { timeout: 3000 }
- extendedWaitUntil:
    visible: { id: welcome-start }
    timeout: 45000
- takeScreenshot: shots/a01-welcome
- runFlow:
    when:
      visible: { id: welcome-start }
    commands:
      - tapOn: { id: welcome-start }
- runFlow:
    when:
      visible: { text: "يلا نبدأ" }
    commands:
      - tapOn: { text: "يلا نبدأ" }
- takeScreenshot: shots/a02-phone
- tapOn: { id: phone-input }
- inputText: "01000000001"
- takeScreenshot: shots/a03-phone-keyboard
- tapOn: { id: phone-send }
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: shots/a04-otp
- tapOn: { id: otp-input }
- inputText: "123456"
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: shots/a05-password
- tapOn: { id: password-1 }
- inputText: "Test2026ok"
- tapOn: { id: password-2 }
- inputText: "Test2026ok"
- takeScreenshot: shots/a06-password-keyboard
- tapOn: { id: password-save }
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: shots/a07-business
- tapOn: { id: business-name }
- inputText: "سوبر ماركت النور"
- takeScreenshot: shots/a08-business-keyboard
- tapOn: { id: business-next }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: shots/a09-owner
- tapOn: { id: owner-name }
- inputText: "أحمد"
- tapOn: { id: owner-finish }
- extendedWaitUntil: { visible: { id: home-sell }, timeout: 60000 }
- takeScreenshot: shots/b01-home
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- takeScreenshot: shots/b02-home-scrolled
# Sample data so lists, invoices and reports have content
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- tapOn: { text: "جرّب ببيانات تجريبية.*", optional: true }
- waitForAnimationToEnd: { timeout: 8000 }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- takeScreenshot: shots/b03-home-after-sample
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- takeScreenshot: shots/b03b-home-plan-card
# Ad slot (free plan; forced on in this screenshot build, labelled, with «remove ads — upgrade»)
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: shots/b04-home-ad
- tapOn: { id: ads-remove, optional: true }
- waitForAnimationToEnd
- takeScreenshot: shots/b05-ad-to-plans
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- tapOn: { id: manual-pro, optional: true }
- waitForAnimationToEnd
- takeScreenshot: shots/b06-upgrade
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- takeScreenshot: shots/b07-upgrade-bottom
- launchApp: { stopApp: false }
- openLink: "daftarak://"
- waitForAnimationToEnd
# Tabs
- tapOn: { id: tab-plus }
- waitForAnimationToEnd
- takeScreenshot: shots/c00-quick-sheet
- back
- waitForAnimationToEnd
- takeScreenshot: shots/c00b-quick-sheet-closed
- launchApp: { stopApp: false }
- swipe: { start: "50%, 25%", end: "50%, 70%" }
- swipe: { start: "50%, 25%", end: "50%, 70%" }
- swipe: { start: "50%, 25%", end: "50%, 70%" }
- swipe: { start: "50%, 25%", end: "50%, 70%" }
- tapOn: { id: home-sell }
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: shots/c01-sell-empty
- tapOn: { id: pos-search, optional: true }
- inputText: "شاي"
- waitForAnimationToEnd
- takeScreenshot: shots/c02-sell-search-keyboard
- tapOn: { text: "شاي.*", index: 1, optional: true }
- tapOn: { id: pos-search, optional: true }
- inputText: "أرز"
- waitForAnimationToEnd
- tapOn: { text: "أرز.*", index: 1, optional: true }
- takeScreenshot: shots/c03-sell-cart
- tapOn: { id: pos-pay, optional: true }
- waitForAnimationToEnd
- takeScreenshot: shots/c04-pay
- tapOn: { id: pay-confirm, optional: true }
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: shots/c05-done
- launchApp: { stopApp: false }
- openLink: "daftarak://"
- waitForAnimationToEnd
- tapOn: { id: tab-plus, optional: true }
- waitForAnimationToEnd
- tapOn: { id: quick-sell, optional: true }
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: shots/c06-sell-from-quick
- launchApp: { stopApp: false }
- openLink: "daftarak://products"
- waitForAnimationToEnd
- takeScreenshot: shots/d01-products
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- takeScreenshot: shots/d02-products-scrolled
- openLink: "daftarak://parties"
- waitForAnimationToEnd
- takeScreenshot: shots/e01-parties
- tapOn: { text: "الموردين", optional: true }
- takeScreenshot: shots/e02-suppliers
- openLink: "daftarak://more"
- waitForAnimationToEnd
- takeScreenshot: shots/f01-more
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- takeScreenshot: shots/f02-more-scrolled
- openLink: "daftarak://"
# Forms with the keyboard open (the field at the bottom must stay visible)
- openLink: "daftarak://products/form"
- waitForAnimationToEnd
- takeScreenshot: shots/g01-product-form
- tapOn: { text: "مثلاً.*", optional: true }
- inputText: "منتج اختبار"
- takeScreenshot: shots/g02-product-form-keyboard
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- takeScreenshot: shots/g03-product-form-bottom-keyboard
- back
- back
- openLink: "daftarak://parties/form?type=C"
- waitForAnimationToEnd
- takeScreenshot: shots/g04-customer-form
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- swipe: { start: "50%, 62%", end: "50%, 22%" }
- takeScreenshot: shots/g05-customer-form-bottom
- back
# Every other screen (top + scrolled)
- runFlow: { file: visit.yaml, env: { ROUTE: "search", NAME: "h01-search" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "inbox", NAME: "h02-inbox" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "sales", NAME: "h03-sales" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "sales/drafts", NAME: "h04-drafts" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "purchases", NAME: "h05-purchases" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "purchases/new", NAME: "h06-purchase-new" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "vouchers", NAME: "h07-vouchers" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "vouchers/new?type=RECEIPT", NAME: "h08-voucher-receipt" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "vouchers/new?type=EXPENSE", NAME: "h09-voucher-expense" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "expenses", NAME: "h10-expenses" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "expenses/categories", NAME: "h11-expense-categories" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "shifts", NAME: "h12-shifts" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "offers", NAME: "h13-offers" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "offers/form", NAME: "h14-offer-form" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "products/categories", NAME: "h15-categories" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "products/import", NAME: "h16-import" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "products/count", NAME: "h17-stock-count" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "products/bulk", NAME: "h18-bulk" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "products/check", NAME: "h19-price-check" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports", NAME: "i00-reports" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/sales_day", NAME: "i01-r-sales-day" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/sales_product", NAME: "i02-r-sales-product" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/sales_category", NAME: "i03-r-sales-category" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/sales_customer", NAME: "i04-r-sales-customer" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/sales_user", NAME: "i05-r-sales-user" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/pnl", NAME: "i06-r-pnl" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/stock_valuation", NAME: "i07-r-stock" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/slow_stock", NAME: "i08-r-slow" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/expiring", NAME: "i09-r-expiring" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/aging_c", NAME: "i10-r-aging-c" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/aging_s", NAME: "i11-r-aging-s" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/purchases", NAME: "i12-r-purchases" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/expenses", NAME: "i13-r-expenses" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/shifts", NAME: "i14-r-shifts" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "reports/discounts_user", NAME: "i15-r-discounts" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/users", NAME: "j01-users" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/user-form", NAME: "j02-user-form" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/subscription", NAME: "j03-subscription" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/security", NAME: "j04-security" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/password", NAME: "j05-password" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/appearance", NAME: "j06-appearance" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/language", NAME: "j07-language" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/printers", NAME: "j08-printers" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/receipt", NAME: "j09-receipt" } }
# Print templates: thermal 80, thermal 58, A4 live preview
- launchApp: { stopApp: false }
- runFlow: unlock.yaml
- openLink: "daftarak://settings/templates"
- waitForAnimationToEnd: { timeout: 4000 }
- tapOn: { text: "حراري 80", optional: true }
- waitForAnimationToEnd
- takeScreenshot: shots/j09b-templates-80
- tapOn: { text: "حراري 58", optional: true }
- waitForAnimationToEnd
- takeScreenshot: shots/j09c-templates-58
- tapOn: { text: "A4", optional: true }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: shots/j09d-templates-a4
- back
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/backup", NAME: "j10-backup" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/sessions", NAME: "j11-sessions" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/devices", NAME: "j11b-devices" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/add-phone", NAME: "j11c-add-phone" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/integrity", NAME: "j12-integrity" } }
- runFlow: { file: visit.yaml, env: { ROUTE: "settings/audit", NAME: "j13-audit" } }
# Lock screen and unlock with the password
- tapOn: { text: "الرئيسية", optional: true }
- tapOn: { id: home-lock, optional: true }
- waitForAnimationToEnd
- takeScreenshot: shots/k01-lock
- tapOn: { id: lock-password, optional: true }
- inputText: "Test2026ok"
- takeScreenshot: shots/k02-lock-keyboard
- tapOn: { id: pin-ok, optional: true }
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: shots/k03-after-unlock
# Language switch Arabic → English → Arabic (changes the layout direction: the app reloads itself).
- openLink: "daftarak://settings/language"
- waitForAnimationToEnd: { timeout: 4000 }
- runFlow: unlock.yaml
- tapOn: { text: "English" }
- waitForAnimationToEnd: { timeout: 15000 }
- launchApp: { stopApp: false }
- runFlow: unlock.yaml
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: shots/l01-after-english
- openLink: "daftarak://settings/language"
- waitForAnimationToEnd: { timeout: 4000 }
- runFlow: unlock.yaml
- takeScreenshot: shots/l02-language-en
- tapOn: { text: "العربية" }
- waitForAnimationToEnd: { timeout: 15000 }
- launchApp: { stopApp: false }
- runFlow: unlock.yaml
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: shots/l03-after-arabic
