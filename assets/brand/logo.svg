<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0866FF"/>
      <stop offset="1" stop-color="#0B2F78"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- soft shadow under the book -->
  <ellipse cx="256" cy="392" rx="150" ry="16" fill="#0B1F4D" opacity="0.35"/>
  <!-- left page -->
  <path d="M256 176 C214 150 156 146 112 162 L112 366 C156 350 214 354 256 380 Z" fill="#FFFFFF"/>
  <!-- right page -->
  <path d="M256 176 C298 150 356 146 400 162 L400 366 C356 350 298 354 256 380 Z" fill="url(#pageR)"/>
  <!-- spine -->
  <path d="M256 176 L256 380" stroke="#0B2F78" stroke-width="5" opacity="0.25"/>
  <!-- ledger lines (right page, read right-to-left like Arabic) -->
  <g stroke="#0F4CC7" stroke-width="12" stroke-linecap="round">
    <line x1="290" y1="222" x2="356" y2="214"/>
    <line x1="290" y1="258" x2="372" y2="250"/>
    <line x1="290" y1="294" x2="340" y2="288"/>
  </g>
  <!-- tick on left page = "settled" -->
  <path d="M150 268 L182 298 L226 236" fill="none" stroke="#0080F9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- amber bookmark ribbon -->
  <path d="M362 150 h26 v96 l-13 -13 l-13 13 z" fill="#0080F9"/>
</svg>
