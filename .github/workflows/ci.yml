name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm --filter @daftarak/shared typecheck
          pnpm --filter @daftarak/api typecheck
          pnpm --filter @daftarak/mobile typecheck
          pnpm --filter @daftarak/admin typecheck
      - name: Tests — shared (Vitest)
        run: pnpm --filter @daftarak/shared test
      - name: Tests — Worker (Vitest in workerd)
        run: pnpm --filter @daftarak/api test
      - name: Tests — mobile (Jest)
        run: pnpm --filter @daftarak/mobile test -- --ci
      - name: Build admin
        run: pnpm --filter @daftarak/admin build
      - name: Bundle mobile (Android JS)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/export
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
