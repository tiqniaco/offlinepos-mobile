# Publish an Android update to existing users (outside the store): signed APK → R2 → release row.
# The app checks /v1/app/latest; "forced" makes everyone below this version update before continuing.
name: publish-android
on:
  workflow_dispatch:
    inputs:
      forced:
        description: Force everyone to update (لازم يحدّث)
        type: boolean
        default: false
      notes:
        description: What's new (Arabic, shown in the update window)
        type: string
        default: تحسينات وإصلاحات
permissions:
  contents: read
concurrency:
  group: publish-android
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://daftarak-api.mallimerp.com' }}
  NODE_ENV: production
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: pnpm install --frozen-lockfile
        env: { NODE_ENV: development }
      - name: Checks
        env:
          NODE_ENV: test
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          [ "$HAS_KEYSTORE" = "true" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — updates must be signed with the upload key."; exit 1; }
          pnpm --filter @daftarak/mobile typecheck && pnpm --filter @daftarak/mobile test
      - name: Version + licence key
        run: |
          CODE=$(( ($(date +%s) - 1767225600) / 60 ))
          echo "BUILD_NUMBER=$CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          KEY=$(curl -sf "$EXPO_PUBLIC_API_URL/v1/licence/public-key" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.kid+":"+j.publicKey)})')
          [ -n "$KEY" ] || { echo "::error::could not read the licence key"; exit 1; }
          echo "EXPO_PUBLIC_LICENCE_PUBLIC_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "DAFTARAK_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: apps/mobile
        env:
          DAFTARAK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAFTARAK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DAFTARAK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/kashiro-$BUILD_NUMBER.apk"
      - name: Upload to R2 + register the release
        working-directory: apps/api
        # Workflow inputs go through env (never interpolated into the script / SQL text).
        env:
          NOTES_INPUT: ${{ inputs.notes }}
          FORCED_INPUT: ${{ inputs.forced }}
        run: |
          F="$GITHUB_WORKSPACE/kashiro-$BUILD_NUMBER.apk"
          SHA=$(sha256sum "$F" | cut -d' ' -f1); SIZE=$(stat -c%s "$F")
          npx wrangler r2 object put "daftarak-backups/releases/kashiro-$BUILD_NUMBER.apk" --file "$F" --content-type application/vnd.android.package-archive --remote
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).find(x=>x.name==="daftarak").uuid))')
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/g" wrangler.jsonc
          NOTES=$(printf '%s' "$NOTES_INPUT" | head -c 1000 | sed "s/'/''/g")
          if [ "$FORCED_INPUT" = "true" ]; then FORCED=1; else FORCED=0; fi
          case "$BUILD_NUMBER$SIZE" in *[!0-9]*) echo "::error::bad build number / size"; exit 1;; esac
          npx wrangler d1 execute daftarak --remote --env production --command \
            "INSERT INTO app_releases (id, platform, version_code, version_name, file_key, sha256, size, notes_ar, forced, created_at) VALUES ('$(cat /proc/sys/kernel/random/uuid)', 'android', $BUILD_NUMBER, '$APP_VERSION', 'releases/kashiro-$BUILD_NUMBER.apk', '$SHA', $SIZE, '$NOTES', $FORCED, $(date +%s)000)"
          URL="$EXPO_PUBLIC_API_URL/v1/app/download/kashiro-$BUILD_NUMBER.apk"
          { echo "### ✅ Published $APP_VERSION (code $BUILD_NUMBER) — forced: $FORCED"; echo; echo "Direct download: $URL"; } >> "$GITHUB_STEP_SUMMARY"
          echo "Direct download: $URL"
